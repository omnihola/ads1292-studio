[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ads1292-studio"
version = "0.1.0"
description = "Research ECG acquisition and review app for TI ADS1292RECG-FE / ADS1x9x ECG-FE boards"
requires-python = ">=3.11"
dependencies = [
  "matplotlib",
  "numpy",
  "pyserial",
  "seaborn",
  "scipy",
]

[project.scripts]
ads1292-studio = "ads1292_studio.app:main"
ads1292-studio-cli = "ads1292_studio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ads1292_studio = ["assets/*.png"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
